<title>Unser Kochbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Young+Serif&display=swap">
<style>
/* Layout: Design-System „Linkedin-Niklas“ fürs Handy. Vollflächige Farbfelder, ein Grund und eine Akzentfarbe je Fläche, Versal-Grotesk für Aussagen, Serif für Fließtext, Halftone-Raster statt Schatten. */
@font-face { font-family: "Young Serif Light"; src: url("fonts/YoungSerif-Light.otf") format("opentype"); font-weight: 300; font-display: swap; }
:root {
  --ultramarine: #3F37FF; --cobalt: #023FA5; --midnight: #240D57; --violet: #592795; --raspberry: #EA465C;
  --signal-red: #ED292A; --sun: #FBC507; --rust: #CE4000; --magenta: #ED40B5; --paper: #ECEDDF; --white: #FFFFFF;
  --bg: var(--paper);
  --surface: var(--white);
  --ink: var(--midnight);
  --muted: color-mix(in srgb, var(--midnight) 70%, var(--paper));
  --line: color-mix(in srgb, var(--midnight) 13%, var(--paper));
  --accent: var(--ultramarine);
  --on-accent: var(--paper);
  --tagc: var(--ultramarine);
  --badge: var(--midnight);
  --on-badge: var(--paper);
  --danger: var(--signal-red);
  --f-display: "PP Agrandir Grand Heavy", "PPAgrandir-GrandHeavy", "PP Agrandir", "Unbounded", system-ui, sans-serif;
  --f-serif: "Young Serif Light", "Young Serif", Georgia, serif;
  --margin: 16px;
  --halftone-pitch: 10px;
  --radius-badge: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--midnight); --surface: color-mix(in srgb, var(--midnight) 80%, var(--violet)); --ink: var(--paper);
    --muted: color-mix(in srgb, var(--paper) 70%, var(--midnight)); --line: color-mix(in srgb, var(--paper) 14%, var(--midnight));
    --accent: var(--sun); --on-accent: var(--midnight); --tagc: var(--sun); --badge: var(--sun); --on-badge: var(--midnight);
    --danger: var(--raspberry); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: var(--midnight); --surface: color-mix(in srgb, var(--midnight) 80%, var(--violet)); --ink: var(--paper);
  --muted: color-mix(in srgb, var(--paper) 70%, var(--midnight)); --line: color-mix(in srgb, var(--paper) 14%, var(--midnight));
  --accent: var(--sun); --on-accent: var(--midnight); --tagc: var(--sun); --badge: var(--sun); --on-badge: var(--midnight);
  --danger: var(--raspberry); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-serif); font-weight: 300; font-size: 17px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
h1, h2, h3, .disp { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; letter-spacing: -0.05em; text-wrap: balance; margin: 0; line-height: 1; }
.lab { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; font-size: .72rem; line-height: 1.2; }

/* Farbfeld oben */
.band { position: relative; overflow: hidden; background: var(--ultramarine); color: var(--paper); padding-inline: var(--margin); padding-block: 30px 18px; }
.band::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle, var(--cobalt) 36%, transparent 39%); background-size: var(--halftone-pitch) var(--halftone-pitch);
  -webkit-mask: radial-gradient(ellipse 45% 85% at 88% 40%, #000 45%, transparent 75%); mask: radial-gradient(ellipse 45% 85% at 88% 40%, #000 45%, transparent 75%); }
.band > * { position: relative; max-width: 640px; margin-inline: auto; }
.band h1 { font-size: clamp(2.5rem, 12vw, 3.6rem); line-height: .92; }
.band .count { display: block; margin-top: 14px; font-family: var(--f-serif); font-size: 1rem; text-align: right; font-variant-numeric: oldstyle-nums; }

.wrap { max-width: 640px; margin: 0 auto; padding-inline: var(--margin); padding-block: 0 120px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: grid; gap: 10px; }
.search { position: relative; }
.search input { width: 100%; border: 0; background: var(--surface); border-radius: 0; padding: 13px 44px; font-size: 1rem; }
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink); }
.search .clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; width: 38px; height: 38px; color: var(--muted); font-size: 1.3rem; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.seg button { border: 0; background: var(--surface); padding: 11px 4px; font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: .72rem; letter-spacing: .01em; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button[data-kind="herzhaft"][aria-pressed="true"], .seg button[data-k="herzhaft"][aria-pressed="true"] { background: var(--ultramarine); color: var(--paper); }
.seg button[data-kind="süß"][aria-pressed="true"], .seg button[data-k="süß"][aria-pressed="true"] { background: var(--violet); color: var(--sun); }
.seg small { font-family: var(--f-serif); font-weight: 300; text-transform: none; font-size: .85rem; font-variant-numeric: oldstyle-nums; }
.chiprow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * var(--margin)); padding-inline: var(--margin); }
.chiprow::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--surface); border-radius: var(--radius-badge); padding: 8px 11px; font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: .68rem; letter-spacing: .01em; white-space: nowrap; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ultramarine); color: var(--paper); }
.chip.ing { background: transparent; box-shadow: inset 0 0 0 2px var(--sun); }
.chip.ing[aria-pressed="true"] { background: var(--sun); color: var(--midnight); box-shadow: none; }
.chip b { color: inherit; }
.active { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.active .reset { border: 0; background: none; color: var(--tagc); padding: 6px 4px; font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: .68rem; text-decoration: underline; text-underline-offset: 3px; }

/* Würfel */
.dice { position: relative; overflow: hidden; margin-top: 8px; width: 100%; border: 0; border-radius: 0; background: var(--sun); color: var(--midnight); padding: 20px 18px; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px; text-align: left; }
.dice::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle, var(--paper) 32%, transparent 35%); background-size: var(--halftone-pitch) var(--halftone-pitch);
  -webkit-mask: radial-gradient(ellipse 40% 90% at 92% 50%, #000 40%, transparent 72%); mask: radial-gradient(ellipse 40% 90% at 92% 50%, #000 40%, transparent 72%); }
.dice > * { position: relative; }
.dice:active { transform: scale(.99); }
.dice:disabled { opacity: .5; }
.dice .lbl { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; letter-spacing: -0.05em; font-size: 1.35rem; line-height: 1; min-width: 0; overflow-wrap: anywhere; }
.dice .sub { display: block; margin-top: 8px; font-family: var(--f-serif); font-weight: 300; text-transform: none; letter-spacing: 0; font-size: .95rem; line-height: 1.25; color: var(--midnight); }
.dice svg.die { width: 52px; height: 52px; }
.dice.rolling svg.die { animation: roll .7s cubic-bezier(.3,.7,.4,1); }
@keyframes roll { from { transform: rotate(-200deg) scale(.8); } to { transform: none; } }

/* Liste */
.listhead { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; margin-bottom: 10px; gap: 12px; }
.listhead h2 { font-size: 1.05rem; }
.listhead select { border: 0; background: var(--surface); border-radius: 0; padding: 8px 10px; font-family: var(--f-serif); font-size: .9rem; }
.list { display: grid; gap: 6px; }
.card { display: grid; grid-template-columns: 88px 1fr; gap: 14px; align-items: center; border: 0; border-radius: 0; background: var(--surface); padding: 0; text-align: left; width: 100%; color: var(--ink); }
.card .body { min-width: 0; display: grid; gap: 6px; padding: 10px 12px 10px 0; }
.card h3 { font-size: .98rem; line-height: 1.05; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: .88rem; font-variant-numeric: oldstyle-nums; }
.tags { display: flex; flex-wrap: wrap; gap: 3px 9px; font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: .62rem; letter-spacing: .01em; color: var(--tagc); }
.thumb { position: relative; overflow: hidden; width: 88px; height: 88px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 2.2rem; letter-spacing: -0.05em; }
.thumb::before, .hero::before { content: ""; position: absolute; inset: 0; background-size: var(--halftone-pitch) var(--halftone-pitch); -webkit-mask: radial-gradient(circle at 100% 0%, #000 20%, transparent 65%); mask: radial-gradient(circle at 100% 0%, #000 20%, transparent 65%); }
.thumb.herzhaft, .hero.herzhaft { background: var(--ultramarine); color: var(--paper); }
.thumb.herzhaft::before, .hero.herzhaft::before { background-image: radial-gradient(circle, var(--cobalt) 36%, transparent 39%); }
.thumb.süß, .hero.süß { background: var(--violet); color: var(--sun); }
.thumb.süß::before, .hero.süß::before { background-image: radial-gradient(circle, var(--midnight) 36%, transparent 39%); }
.thumb:has(img)::before, .hero:has(img)::before { display: none; }
.thumb > *, .hero > * { position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.kind-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ultramarine); margin-right: 6px; vertical-align: 0; }
.kind-dot.süß { background: var(--violet); }
:root[data-theme="dark"] .kind-dot { box-shadow: 0 0 0 1.5px var(--paper); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kind-dot { box-shadow: 0 0 0 1.5px var(--paper); } }

.empty { text-align: center; padding: 36px 8px; color: var(--muted); display: grid; gap: 14px; justify-items: center; }
.empty h2 { color: var(--ink); font-size: 1.6rem; }
.empty p { margin: 0; max-width: 34ch; }
.notice { background: var(--surface); padding: 14px; font-size: .95rem; color: var(--ink); margin-top: 12px; }
.inboxnote { display: flex; align-items: center; gap: 10px; background: var(--surface); padding: 12px 14px; margin-top: 8px; font-size: .95rem; }
.inboxnote .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--sun); }

.btn { border: 0; border-radius: var(--radius-badge); padding: 14px 18px; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: .78rem; letter-spacing: .01em; line-height: 1.15; text-align: center; }
.btn.ghost { background: var(--surface); color: var(--ink); }
.btn.warn { background: var(--danger); color: var(--white); }
.btn.sun { background: var(--sun); color: var(--midnight); }
.btn.sm { padding: 10px 13px; font-size: .7rem; }
.btn:disabled { opacity: .5; }
.fab { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 6; padding: 17px 20px; font-size: .85rem; }

/* Blätter */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.bar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; background: var(--bg); }
.bar strong { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: .8rem; letter-spacing: .01em; }
.iconbtn { border: 0; width: 44px; height: 44px; border-radius: var(--radius-badge); background: var(--surface); display: grid; place-items: center; font-size: 1.2rem; color: var(--ink); }
.sheet .inner { max-width: 640px; margin: 0 auto; padding-inline: var(--margin); padding-block: 0 40px; display: grid; gap: 22px; }

.hero { position: relative; overflow: hidden; margin-inline: calc(-1 * var(--margin)); max-width: calc(100% + 2 * var(--margin)); height: min(46vh, 75vw); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 5rem; letter-spacing: -0.05em; }
.hero.nophoto { height: 130px; font-size: 3.6rem; }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dtitle { display: grid; gap: 12px; }
.dtitle h2 { font-size: clamp(1.7rem, 8vw, 2.4rem); line-height: .98; overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: .95rem; font-variant-numeric: oldstyle-nums; }
.source { font-size: .95rem; color: var(--muted); overflow-wrap: anywhere; }
.source a { color: var(--tagc); }
.section h3 { font-size: 1.2rem; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.stepper { display: inline-flex; align-items: center; background: var(--surface); font-family: var(--f-serif); font-weight: 300; font-size: .95rem; text-transform: none; letter-spacing: 0; }
.stepper button { border: 0; background: var(--sun); color: var(--midnight); width: 40px; height: 40px; font-size: 1.3rem; line-height: 1; font-family: var(--f-display); font-weight: 800; }
.stepper span { min-width: 6.8em; text-align: center; font-variant-numeric: oldstyle-nums; }
.ings { list-style: none; margin: 0; padding: 0; background: var(--surface); }
.ings li { display: grid; grid-template-columns: 5.6em 1fr; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: baseline; }
.ings li:last-child { border-bottom: 0; }
.ings li.done { opacity: .35; text-decoration: line-through; }
.ings .amt { font-family: var(--f-display); font-weight: 800; font-size: .78rem; letter-spacing: -.01em; text-align: right; color: var(--tagc); font-variant-numeric: tabular-nums; }
.ings li.grp { display: block; cursor: default; font-family: var(--f-display); font-weight: 800; font-size: .68rem; text-transform: uppercase; letter-spacing: .01em; color: var(--muted); background: var(--bg); padding-block: 12px 6px; padding-inline: 0; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 14px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 40px 1fr; gap: 14px; cursor: pointer; align-items: start; }
.steps li::before { content: counter(s); width: 40px; height: 40px; border-radius: var(--radius-badge); background: var(--badge); color: var(--on-badge); font-family: var(--f-display); font-weight: 800; display: grid; place-items: center; font-size: 1.05rem; }
.steps li span { padding-top: 8px; }
.steps li.done { opacity: .35; }
.steps li.done::before { content: "✓"; }
.hint { color: var(--muted); font-size: .88rem; margin: 8px 0 0; }
.note { background: var(--surface); padding: 14px; white-space: pre-wrap; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }

/* Hinzufügen */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tab { border: 0; background: var(--surface); padding: 14px 6px; display: grid; gap: 6px; justify-items: center; text-align: center; font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: .7rem; letter-spacing: .01em; color: var(--ink); }
.tab small { font-family: var(--f-serif); font-weight: 300; text-transform: none; letter-spacing: 0; font-size: .8rem; color: inherit; opacity: .8; line-height: 1.2; }
.tab[aria-pressed="true"] { background: var(--ultramarine); color: var(--paper); }
.drop { background: var(--surface); padding: 24px 14px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.drop.over { outline: 3px solid var(--sun); }
.previews { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.previews div { position: relative; width: 80px; height: 80px; overflow: hidden; background: var(--line); }
.previews img { width: 100%; height: 100%; object-fit: cover; }
.previews button { position: absolute; top: 3px; right: 3px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--midnight); color: var(--paper); font-size: .8rem; line-height: 1; }
textarea, .field input, .field select { width: 100%; border: 0; background: var(--surface); border-radius: 0; padding: 12px; font-size: 1rem; font-family: var(--f-serif); font-weight: 300; }
textarea { resize: vertical; min-height: 120px; line-height: 1.4; }
textarea::placeholder, .field input::placeholder { color: var(--muted); }
textarea:focus, .field input:focus { outline: 3px solid var(--sun); outline-offset: 0; }
.field { display: grid; gap: 8px; }
.field > label, .field > .lbl { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: .72rem; letter-spacing: .01em; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row2 > * { min-width: 0; }
.err { color: var(--danger); font-size: .95rem; margin: 0; }
.working { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 30px 10px; }
.working strong { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: .9rem; }
.spin { width: 40px; height: 40px; border-radius: 50%; border: 5px solid var(--line); border-top-color: var(--tagc); animation: sp .9s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.photoedit { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.photoedit .thumb { width: 96px; height: 96px; }
.photoedit .btns { display: flex; flex-wrap: wrap; gap: 6px; }
.sticky-save { position: sticky; bottom: 0; background: var(--bg); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; }
.sticky-save .btn { flex: 1; }
.queue { display: grid; gap: 4px; }
.queue h3 { font-size: .9rem; margin-bottom: 6px; }
.qitem { background: var(--surface); padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: .9rem; }
.qitem .u { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qitem .st { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: .6rem; padding: 5px 7px; border-radius: 6px; background: var(--sun); color: var(--midnight); }
.qitem .st.fehler { background: var(--danger); color: var(--white); }
.qitem .msg { grid-column: 1 / -1; color: var(--muted); font-size: .85rem; }
.qitem button { grid-column: 1 / -1; justify-self: start; border: 0; background: none; padding: 2px 0; color: var(--tagc); font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: .62rem; text-decoration: underline; }

.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--sun); color: var(--midnight); padding: 12px 16px; font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: .72rem; max-width: calc(100% - 32px); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>

<div class="band">
  <h1>Unser<br>Kochbuch.</h1>
  <span class="count" id="count"></span>
</div>
<div class="wrap">
  <header class="top">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="vh" for="q">Rezept oder Zutat suchen</label>
      <input id="q" type="search" placeholder="Rezept oder Zutat, z. B. Hähnchen" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="qclear" type="button" aria-label="Suche leeren" hidden>×</button>
    </div>
    <div class="suggest" id="suggest" hidden></div>
    <div class="seg" role="group" aria-label="Art">
      <button type="button" data-kind="alle" aria-pressed="true">Alle <small id="n-alle"></small></button>
      <button type="button" data-kind="herzhaft" aria-pressed="false">Herzhaft <small id="n-herzhaft"></small></button>
      <button type="button" data-kind="süß" aria-pressed="false">Süß <small id="n-süß"></small></button>
    </div>
    <div class="chiprow" id="tagrow" aria-label="Kategorien"></div>
    <div class="active" id="active" hidden></div>
  </header>

  <button class="dice" id="dice" type="button">
    <svg class="die" viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="4" width="40" height="40" rx="10" fill="var(--midnight)"/><g fill="var(--sun)"><circle cx="15" cy="15" r="3.4"/><circle cx="33" cy="15" r="3.4"/><circle cx="24" cy="24" r="3.4"/><circle cx="15" cy="33" r="3.4"/><circle cx="33" cy="33" r="3.4"/></g></svg>
    <span class="lbl" id="dicelbl">Was kochen wir heute?<span class="sub" id="dicesub">Zufallsgericht würfeln</span></span>
      </button>
  <div id="inboxbox"></div>

  <div class="listhead">
    <h2 id="listtitle">Alle Rezepte</h2>
    <label class="vh" for="sort">Sortierung</label>
    <select id="sort">
      <option value="neu">Neueste zuerst</option>
      <option value="az">A–Z</option>
      <option value="selten">Lange nicht gekocht</option>
    </select>
  </div>
  <div class="list" id="list"></div>
  <div id="emptybox"></div>
</div>

<button class="btn fab" id="fab" type="button" hidden>＋ Rezept</button>

<!-- Rezept ansehen -->
<section class="sheet" id="detail" hidden aria-label="Rezept"></section>

<!-- Rezept hinzufügen -->
<section class="sheet" id="add" hidden aria-label="Rezept hinzufügen">
  <div class="bar">
    <button class="iconbtn" type="button" data-close="add" aria-label="Schließen">←</button>
    <strong>Neues Rezept</strong>
    <span style="width:42px"></span>
  </div>
  <div class="inner" id="addinner"></div>
</section>

<!-- Formular -->
<section class="sheet" id="form" hidden aria-label="Rezept bearbeiten">
  <div class="bar">
    <button class="iconbtn" type="button" data-close="form" aria-label="Schließen">←</button>
    <strong id="formtitle">Rezept prüfen</strong>
    <span style="width:42px"></span>
  </div>
  <form class="inner" id="recipeform" novalidate>
    <div class="photoedit">
      <div class="thumb" id="f-photo">?</div>
      <div class="field">
        <span class="lbl">Foto vom Gericht</span>
        <div class="btns">
          <label class="btn ghost sm" for="f-photofile">Foto wählen</label>
          <button class="btn ghost sm" type="button" id="f-photodel" hidden>Entfernen</button>
        </div>
        <input id="f-photofile" type="file" accept="image/*" class="vh">
      </div>
    </div>
    <div class="field">
      <label for="f-title">Name</label>
      <input id="f-title" type="text" required placeholder="z. B. Omas Kartoffelsuppe">
    </div>
    <div class="field">
      <span class="lbl">Art</span>
      <div class="seg" role="group" aria-label="Art" id="f-kind" style="grid-template-columns:1fr 1fr">
        <button type="button" data-k="herzhaft" aria-pressed="true">Herzhaft</button>
        <button type="button" data-k="süß" aria-pressed="false">Süß</button>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="f-servings">Portionen</label>
        <input id="f-servings" type="number" inputmode="numeric" min="1" max="50" value="4">
      </div>
      <div class="field">
        <label for="f-time">Zeit (Minuten)</label>
        <input id="f-time" type="number" inputmode="numeric" min="0" max="1440" placeholder="30">
      </div>
    </div>
    <div class="field">
      <label for="f-tags">Kategorien</label>
      <input id="f-tags" type="text" placeholder="nudeln, schnell, vegetarisch" autocomplete="off">
      <div class="chiprow" id="f-tagsugg"></div>
      <p class="hint">Mit Komma trennen. Tippe unten auf vorhandene Kategorien, um sie zu übernehmen.</p>
    </div>
    <div class="field">
      <label for="f-ings">Zutaten</label>
      <textarea id="f-ings" rows="8" placeholder="400 g Spaghetti&#10;2 EL Olivenöl&#10;1 Zehe Knoblauch&#10;Für die Soße:&#10;200 ml Sahne"></textarea>
      <p class="hint">Eine Zutat pro Zeile, Menge zuerst. Eine Zeile mit Doppelpunkt am Ende wird zur Zwischenüberschrift.</p>
    </div>
    <div class="field">
      <label for="f-steps">Zubereitung</label>
      <textarea id="f-steps" rows="8" placeholder="Wasser aufsetzen und salzen.&#10;Nudeln 9 Minuten kochen."></textarea>
      <p class="hint">Ein Schritt pro Zeile.</p>
    </div>
    <div class="field">
      <label for="f-note">Notiz (optional)</label>
      <textarea id="f-note" rows="3" style="min-height:70px" placeholder="z. B. Kinder mögen es mit mehr Käse"></textarea>
    </div>
    <div class="field">
      <label for="f-source">Quelle (optional)</label>
      <input id="f-source" type="url" inputmode="url" placeholder="https://… oder Kochbuch, Seite 42">
    </div>
    <p class="err" id="f-err" hidden></p>
    <div class="sticky-save">
      <button class="btn ghost" type="button" data-close="form">Abbrechen</button>
      <button class="btn" type="submit" id="f-save">Speichern</button>
    </div>
  </form>
</section>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = s => String(s || "").toLowerCase().normalize("NFC").trim();
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  const S = {
    recipes: [], status: "loading", q: "", kind: "alle", tags: new Set(), ings: [],
    sort: store.get("kb.sort") || "neu", canWrite: false, db: null, sample: null, maxImages: 0,
    photos: new Map(), inbox: [], detail: null, lastRandom: [], form: null, draft: null,
  };

  /* ---------- Mengen ---------- */
  const FR = { "½": .5, "¼": .25, "¾": .75, "⅓": 1 / 3, "⅔": 2 / 3, "⅛": .125 };
  const UNITS = ["g", "kg", "mg", "ml", "cl", "dl", "l", "EL", "TL", "Msp.", "Msp", "Prise", "Prisen", "Stück", "Stk.", "Stk", "Dose", "Dosen", "Bund", "Pck.", "Pck", "Päckchen", "Packung", "Packungen", "Becher", "Tasse", "Tassen", "Zehe", "Zehen", "Scheibe", "Scheiben", "Glas", "Gläser", "Handvoll", "Würfel", "Stange", "Stangen", "Blatt", "Blätter", "Zweig", "Zweige", "Liter", "Spritzer", "Schuss", "Tropfen", "Kopf", "Knolle", "Knollen", "Rolle", "Tüte", "Beutel", "Flasche", "Portion", "Portionen", "Tafel", "Kugel", "Kugeln"];
  const UNIT_MAP = new Map(UNITS.map(u => [u.toLowerCase(), u]));
  const num = v => { const n = typeof v === "number" ? v : parseFloat(String(v).replace(",", ".")); return isFinite(n) && n > 0 ? n : null; };

  function parseIngLine(line) {
    let s = line.replace(/^[\s•\-–*]+/, "").trim();
    if (!s) return null;
    if (/:$/.test(s)) return { h: true, n: s.slice(0, -1).trim() };
    let a = null, m;
    if ((m = s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)\s*/))) a = +m[1] + m[2] / m[3];
    else if ((m = s.match(/^(\d+)\s*\/\s*(\d+)\s*/))) a = m[1] / m[2];
    else if ((m = s.match(/^(\d+(?:[.,]\d+)?)\s*([½¼¾⅓⅔⅛])?\s*/))) a = parseFloat(m[1].replace(",", ".")) + (m[2] ? FR[m[2]] : 0);
    else if ((m = s.match(/^([½¼¾⅓⅔⅛])\s*/))) a = FR[m[1]];
    if (m) s = s.slice(m[0].length).replace(/^[-–]\s*[\d.,½¼¾]+\s*/, "");
    let u = "";
    const um = s.match(/^([A-Za-zÄÖÜäöüß.]+)\s+(.+)$/);
    if (um && UNIT_MAP.has(um[1].toLowerCase())) { u = UNIT_MAP.get(um[1].toLowerCase()); s = um[2]; }
    return { a: a || null, u, n: s.trim() };
  }
  function fmtAmount(x, u) {
    if (x == null || !isFinite(x)) return "";
    if (/^(g|ml)$/i.test(u) && x >= 50) return String(Math.round(x / 5) * 5);
    if (x >= 20) return String(Math.round(x));
    const w = Math.floor(x), f = x - w;
    const opts = [[0, ""], [.25, "¼"], [1 / 3, "⅓"], [.5, "½"], [2 / 3, "⅔"], [.75, "¾"], [1, ""]];
    let best = opts[0];
    for (const o of opts) if (Math.abs(f - o[0]) < Math.abs(f - best[0])) best = o;
    if (Math.abs(f - best[0]) > .06) return (Math.round(x * 10) / 10).toString().replace(".", ",");
    const W = w + (best[0] === 1 ? 1 : 0);
    if (!best[1]) return String(W);
    return (W ? W : "") + best[1];
  }
  const rawAmount = a => a == null ? "" : String(+a.toFixed(3)).replace(".", ",");
  const ingToLine = i => i.h ? i.n + ":" : [rawAmount(i.a), i.u, i.n].filter(Boolean).join(" ");
  const ingNames = r => (r.ingredients || []).filter(i => !i.h).map(i => norm(i.n));

  /* ---------- Filtern ---------- */
  function matches(r, ignoreKind) {
    if (!ignoreKind && S.kind !== "alle" && r.kind !== S.kind) return false;
    for (const t of S.tags) if (!(r.tags || []).includes(t)) return false;
    const names = ingNames(r);
    for (const f of S.ings) if (!names.some(n => n.includes(f))) return false;
    const q = norm(S.q);
    if (q) {
      const hay = [norm(r.title), ...(r.tags || []).map(norm), ...names].join(" | ");
      if (!hay.includes(q)) return false;
    }
    return true;
  }
  function sorter() {
    if (S.sort === "az") return (a, b) => String(a.title).localeCompare(String(b.title), "de");
    if (S.sort === "selten") return (a, b) => (a.lastCooked || 0) - (b.lastCooked || 0) || String(a.title).localeCompare(String(b.title), "de");
    return (a, b) => (b.createdAt || 0) - (a.createdAt || 0);
  }
  const filtered = () => S.recipes.filter(r => matches(r)).sort(sorter());
  function allTags() {
    const c = new Map();
    for (const r of S.recipes) for (const t of r.tags || []) c.set(t, (c.get(t) || 0) + 1);
    return [...c.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "de")).map(e => e[0]);
  }
  function allIngredients() {
    const c = new Map();
    for (const r of S.recipes) for (const n of new Set(ingNames(r))) c.set(n, (c.get(n) || 0) + 1);
    return c;
  }

  /* ---------- Hauptliste ---------- */
  function metaLine(r) {
    const p = [];
    if (r.time) p.push(r.time + " Min.");
    if (r.servings) p.push(r.servings + " Portionen");
    return p.join(" · ");
  }
  function thumbHTML(r, cls = "thumb") {
    const k = r.kind === "süß" ? "süß" : "herzhaft";
    if (r.thumb) return `<div class="${cls} ${k}"><img src="${esc(r.thumb)}" alt=""></div>`;
    return `<div class="${cls} ${k}" aria-hidden="true">${esc((r.title || "?").trim().charAt(0).toUpperCase())}</div>`;
  }

  function render() {
    const list = filtered();
    const base = S.recipes.filter(r => matches(r, true));
    $("#count").textContent = S.status === "ready" ? `${S.recipes.length} ${S.recipes.length === 1 ? "Rezept" : "Rezepte"}` : "";
    for (const k of ["alle", "herzhaft", "süß"]) {
      $("#n-" + k).textContent = S.status === "ready" ? (k === "alle" ? base.length : base.filter(r => r.kind === k).length) : "";
    }
    $$(".top .seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.kind === S.kind)));

    const tags = allTags();
    $("#tagrow").innerHTML = tags.map(t => `<button type="button" class="chip" data-tag="${esc(t)}" aria-pressed="${S.tags.has(t)}">#${esc(t)}</button>`).join("");
    $("#tagrow").hidden = !tags.length;

    // Zutaten-Vorschläge zur Sucheingabe
    const q = norm(S.q);
    const sg = $("#suggest");
    if (q.length >= 2) {
      const ing = [...allIngredients().entries()].filter(([n]) => n.includes(q) && n !== q).sort((a, b) => b[1] - a[1]).slice(0, 5).map(e => e[0]);
      const chips = [q, ...ing].filter(n => !S.ings.includes(n));
      sg.innerHTML = chips.map((n, i) => `<button type="button" class="chip ing" data-addIng="${esc(n)}">${i === 0 ? "Alles mit <b>" + esc(n) + "</b>" : "Zutat: " + esc(n)}</button>`).join("");
      sg.hidden = !chips.length;
    } else sg.hidden = true;

    const act = $("#active");
    const anyFilter = S.ings.length || S.tags.size || S.kind !== "alle" || q;
    act.innerHTML = S.ings.map(n => `<button type="button" class="chip ing" aria-pressed="true" data-rmIng="${esc(n)}">mit ${esc(n)} ×</button>`).join("")
      + (anyFilter ? `<button type="button" class="reset" id="resetall">Filter zurücksetzen</button>` : "");
    act.hidden = !anyFilter;

    $("#listtitle").textContent = anyFilter ? (list.length === 1 ? "1 passendes Rezept" : `${list.length} passende Rezepte`) : "Alle Rezepte";
    $("#sort").value = S.sort;

    const dice = $("#dice");
    dice.disabled = S.status !== "ready" || !list.length;
    if (!dice.classList.contains("rolling")) {
      $("#dicesub").textContent = !S.recipes.length ? "Sobald Rezepte da sind" : !list.length ? "Kein Rezept passt zum Filter" : anyFilter ? `Zufällig aus ${list.length} passenden` : `Zufällig aus ${list.length} Rezepten`;
    }

    $("#list").innerHTML = list.map(r => `
      <button type="button" class="card" data-open="${esc(r.id)}">
        ${thumbHTML(r)}
        <div class="body">
          <h3>${esc(r.title)}</h3>
          <div class="meta"><span class="kind-dot ${r.kind === "süß" ? "süß" : ""}"></span>${esc(r.kind === "süß" ? "Süß" : "Herzhaft")}${metaLine(r) ? " · " + esc(metaLine(r)) : ""}</div>
          ${(r.tags || []).length ? `<div class="tags">${r.tags.slice(0, 4).map(t => `<span>#${esc(t)}</span>`).join("")}</div>` : ""}
        </div>
      </button>`).join("");

    const eb = $("#emptybox");
    if (S.status === "loading") eb.innerHTML = `<div class="empty"><div class="spin"></div><p>Rezepte werden geladen …</p></div>`;
    else if (S.status === "nodb") eb.innerHTML = `<div class="notice">Die Rezepte können hier nicht geladen werden. Öffne die Seite in Claude und melde dich an, dann erscheinen eure Rezepte.</div>`;
    else if (S.status === "error") eb.innerHTML = `<div class="notice">Die Rezepte konnten nicht geladen werden. Lade die Seite neu.</div>`;
    else if (!S.recipes.length) eb.innerHTML = `<div class="empty">
        <h2>Noch keine Rezepte</h2>
        <p>Fotografiere ein Rezept aus dem Kochbuch, lade einen Screenshot hoch oder füge Text ein. Die KI macht daraus ein fertiges Rezept mit Zutaten und Kategorien.</p>
        ${S.canWrite ? `<button class="btn" type="button" data-action="add">Erstes Rezept hinzufügen</button>` : ""}
      </div>`;
    else if (!list.length) eb.innerHTML = `<div class="empty"><p>Kein Rezept passt zu diesen Filtern.</p><button class="btn ghost sm" type="button" data-action="reset">Filter zurücksetzen</button></div>`;
    else eb.innerHTML = "";

    const waiting = S.inbox.filter(q => q.status !== "fehler").length, failed = S.inbox.length - waiting;
    $("#inboxbox").innerHTML = S.inbox.length ? `<button type="button" class="inboxnote" data-action="add-link" style="border:0;width:100%;text-align:left;color:var(--ink)"><span class="dot"></span><span>${waiting ? `${waiting} ${waiting === 1 ? "Link wird" : "Links werden"} zu Rezepten aufbereitet.` : ""}${failed ? ` ${failed} ${failed === 1 ? "Link" : "Links"} mit Fehler.` : ""}</span></button>` : "";
    $("#fab").hidden = !(S.canWrite && S.status === "ready");
    if (S.detail && !$("#detail").hidden) renderDetail();
  }

  /* ---------- Blätter ---------- */
  function openSheet(id) {
    const el = $("#" + id);
    el.hidden = false; el.scrollTop = 0;
    document.body.style.overflow = "hidden";
  }
  function closeSheet(id) {
    $("#" + id).hidden = true;
    if ($$(".sheet").every(s => s.hidden)) document.body.style.overflow = "";
    if (id === "detail") { S.detail = null; releaseWake(); }
    if (id === "add" && S.draft?.ctl) S.draft.ctl.abort();
  }
  let toastT;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600);
  }
  let wake = null;
  async function holdWake() { try { wake = await navigator.wakeLock?.request("screen"); } catch {} }
  function releaseWake() { try { wake?.release(); } catch {} wake = null; }

  /* ---------- Rezept ansehen ---------- */
  function openDetail(id, fromRandom = false) {
    S.detail = { id, servings: null, fromRandom, doneI: new Set(), doneS: new Set(), confirmDel: false };
    renderDetail();
    openSheet("detail");
    loadPhoto(id);
    holdWake();
  }
  async function loadPhoto(id) {
    const r = S.recipes.find(x => x.id === id);
    if (!r?.hasPhoto || S.photos.has(id) || !S.db) return;
    try {
      const snap = await S.db.doc("photos/" + id).get();
      if (snap.exists) { S.photos.set(id, snap.data().src); if (S.detail?.id === id) renderDetail(); }
    } catch {}
  }
  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } }
  function ago(ts) {
    const d = Math.floor((Date.now() - ts) / 864e5);
    if (d <= 0) return "heute";
    if (d === 1) return "gestern";
    if (d < 30) return `vor ${d} Tagen`;
    const m = Math.round(d / 30);
    return m <= 1 ? "vor einem Monat" : `vor ${m} Monaten`;
  }
  function renderDetail() {
    const D = S.detail, el = $("#detail");
    const r = S.recipes.find(x => x.id === D.id);
    if (!r) { closeSheet("detail"); return; }
    const baseServ = r.servings || 4;
    const serv = D.servings ?? baseServ;
    const f = serv / baseServ;
    const k = r.kind === "süß" ? "süß" : "herzhaft";
    const photo = S.photos.get(r.id) || r.thumb;
    const keepScroll = el.scrollTop;
    el.innerHTML = `
      <div class="bar">
        <button class="iconbtn" type="button" data-close="detail" aria-label="Zurück">←</button>
        ${D.fromRandom ? `<button class="btn sm sun" type="button" data-action="reroll">Nochmal würfeln</button>` : "<span></span>"}
      </div>
      <div class="inner">
        <div class="hero ${k}${photo ? "" : " nophoto"}">${photo ? `<img src="${esc(photo)}" alt="${esc(r.title)}">` : esc((r.title || "?").charAt(0).toUpperCase())}</div>
        <div class="dtitle">
          <h2>${esc(r.title)}</h2>
          <div class="facts">
            <span><span class="kind-dot ${k === "süß" ? "süß" : ""}"></span>${k === "süß" ? "Süß" : "Herzhaft"}</span>
            ${r.time ? `<span>${r.time} Min.</span>` : ""}
            ${r.cookCount ? `<span>${r.cookCount}× gekocht, zuletzt ${ago(r.lastCooked)}</span>` : ""}
          </div>
          ${(r.tags || []).length ? `<div class="tags">${r.tags.map(t => `<span>#${esc(t)}</span>`).join("")}</div>` : ""}
          ${r.source ? `<p class="source" style="margin:0">Quelle: ${/^https?:\/\//i.test(r.source) ? `<a href="${esc(r.source)}" target="_blank" rel="noopener">${esc(hostOf(r.source))}</a>` : esc(r.source)}</p>` : ""}
        </div>
        <div class="section">
          <h3>Zutaten
            <span class="stepper">
              <button type="button" data-serv="-1" aria-label="Weniger Portionen">−</button>
              <span aria-live="polite">${serv} ${serv === 1 ? "Portion" : "Portionen"}</span>
              <button type="button" data-serv="1" aria-label="Mehr Portionen">+</button>
            </span>
          </h3>
          <ul class="ings">
            ${(r.ingredients || []).map((i, n) => i.h
              ? `<li class="grp">${esc(i.n)}</li>`
              : `<li data-ing="${n}" class="${D.doneI.has(n) ? "done" : ""}"><span class="amt">${esc([fmtAmount(i.a != null ? i.a * f : null, i.u), i.u].filter(Boolean).join(" "))}</span><span>${esc(i.n)}</span></li>`).join("")}
          </ul>
          ${f !== 1 ? `<p class="hint">Mengen für ${serv} statt ${baseServ} Portionen umgerechnet.</p>` : `<p class="hint">Tippe auf eine Zutat, um sie abzuhaken.</p>`}
        </div>
        ${(r.steps || []).length ? `<div class="section">
          <h3>Zubereitung</h3>
          <ol class="steps">${r.steps.map((s, n) => `<li data-step="${n}" class="${D.doneS.has(n) ? "done" : ""}"><span>${esc(s)}</span></li>`).join("")}</ol>
        </div>` : ""}
        ${r.note ? `<div class="section"><h3>Notiz</h3><div class="note">${esc(r.note)}</div></div>` : ""}
        ${S.canWrite ? `<div class="section actions">
          <button class="btn" type="button" data-action="cooked">Heute gekocht</button>
          <button class="btn ghost" type="button" data-action="edit">Bearbeiten</button>
          ${D.confirmDel
            ? `<button class="btn warn" type="button" data-action="delete-yes">Wirklich löschen</button><button class="btn ghost" type="button" data-action="delete-no">Behalten</button>`
            : `<button class="btn ghost" type="button" data-action="delete">Löschen</button>`}
        </div>` : ""}
      </div>`;
    el.scrollTop = keepScroll;
  }

  /* ---------- Zufall ---------- */
  function pickRandom() {
    const list = filtered();
    if (!list.length) return null;
    const recent = Date.now() - 4 * 864e5;
    let pool = list.filter(r => !S.lastRandom.includes(r.id) && !(r.lastCooked > recent));
    if (!pool.length) pool = list.filter(r => r.id !== S.lastRandom[S.lastRandom.length - 1]);
    if (!pool.length) pool = list;
    const r = pool[Math.floor(Math.random() * pool.length)];
    S.lastRandom.push(r.id);
    S.lastRandom = S.lastRandom.slice(-Math.min(5, Math.max(1, list.length - 1)));
    return r;
  }
  function roll() {
    const list = filtered();
    const r = pickRandom();
    if (!r) return;
    const dice = $("#dice");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || list.length < 2) { openDetail(r.id, true); return; }
    dice.classList.add("rolling");
    const sub = $("#dicesub");
    let n = 0;
    const iv = setInterval(() => {
      sub.textContent = list[Math.floor(Math.random() * list.length)].title;
      if (++n > 7) {
        clearInterval(iv);
        sub.textContent = r.title;
        setTimeout(() => { dice.classList.remove("rolling"); openDetail(r.id, true); render(); }, 220);
      }
    }, 70);
  }

  /* ---------- Bilder ---------- */
  async function loadBitmap(file) {
    try { return await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch {
      const url = URL.createObjectURL(file);
      try {
        const img = new Image(); img.src = url; await img.decode(); return img;
      } finally { setTimeout(() => URL.revokeObjectURL(url), 1000); }
    }
  }
  function toJpeg(bmp, maxSide, quality, square) {
    const w = bmp.width, h = bmp.height;
    const c = document.createElement("canvas");
    let sx = 0, sy = 0, sw = w, sh = h;
    if (square) { const s = Math.min(w, h); sx = (w - s) / 2; sy = (h - s) / 2; sw = sh = s; }
    const scale = Math.min(1, maxSide / Math.max(sw, sh));
    c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
    c.getContext("2d").drawImage(bmp, sx, sy, sw, sh, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", quality);
  }
  async function makePhoto(file) {
    const bmp = await loadBitmap(file);
    let src = toJpeg(bmp, 1000, .72), q = .72, side = 1000;
    while (src.length > 220000 && side > 400) { side -= 150; q = Math.max(.5, q - .06); src = toJpeg(bmp, side, q); }
    const thumb = toJpeg(bmp, 200, .62, true);
    return { src, thumb };
  }

  async function recognize() {

    if (D.mode === "text" && isUrl(text)) { D.text = ""; return queueLink(text, ""); }
    if (D.mode === "text" && text.length < 10) { D.error = "Füge zuerst den Rezepttext ein."; renderAdd(); return; }

    const known = allTags().slice(0, 60);
    const prompt = `Du hilfst einer Familie, ihr Kochbuch zu pflegen. ${imgs.length ? `Du bekommst ${imgs.length} Bild(er) (Fotos oder Screenshots) eines Rezepts.` : "Du bekommst einen Rezepttext."}
Lies das Rezept und gib es als JSON zurück. Antworte NUR mit diesem JSON-Objekt:
{"title": string, "kind": "herzhaft" | "süß", "servings": number, "time": number | null, "tags": string[], "ingredients": [{"amount": number | null, "unit": string, "name": string, "group": string | null}], "steps": string[], "note": string | null, "source": string | null, "dishPhoto": number | null, "error": string | null}

Regeln:
- Alles auf Deutsch (übersetzen, falls nötig). Titel kurz und natürlich.
- kind: "süß" für Kuchen, Desserts, Süßspeisen, süßes Frühstück; sonst "herzhaft".
- servings: Portionen laut Rezept; wenn nicht angegeben, sinnvoll schätzen (meist 4). time: Gesamtzeit in Minuten oder null.
- ingredients: amount als Zahl (½ = 0.5, "1-2" = 1.5), sonst null (z. B. "Salz nach Geschmack"). unit kurz: g, kg, ml, l, EL, TL, Prise, Stück, Dose, Bund, Pck., Zehe, Scheibe, Becher – oder "" wenn keine. name ohne Menge, z. B. "Hähnchenbrustfilet", "Zwiebel, fein gewürfelt". group: Zwischenüberschrift wie "Für den Teig", sonst null.
- steps: klare, kurze Arbeitsschritte ohne Nummerierung.
- tags: 3 bis 6 Kategorien, klein geschrieben, ohne #, ohne "süß"/"herzhaft". Nimm vorhandene Kategorien, wenn sie passen: ${known.length ? known.join(", ") : "(noch keine)"}. Weitere typische: vegetarisch, vegan, fleisch, hähnchen, fisch, nudeln, reis, kartoffeln, suppe, salat, auflauf, eintopf, ofen, schnell, kuchen, backen, dessert, frühstück, asiatisch, italienisch, kinderliebling, meal-prep.
- note: wichtige Tipps oder Varianten aus der Vorlage, sonst null.
- source: Name des Kochbuchs, der Website oder des Autors, falls erkennbar, sonst null.
- dishPhoto: ${imgs.length ? "0-basierter Index des Bildes, das das fertige Gericht als Foto zeigt (nicht nur Text). Wenn keines, null." : "null"}
- Wenn kein Rezept erkennbar ist: "error" mit kurzer Erklärung, die anderen Felder leer.
${D.mode === "bild" && hint ? `\nHinweis der Familie: ${hint}` : ""}${D.mode === "text" ? `\nRezepttext:\n"""\n${text.slice(0, 40000)}\n"""` : ""}`;

    D.busy = true; D.error = ""; D.ctl = new AbortController(); renderAdd();
    try {
      const res = await S.sample.json(prompt, imgs.length ? { images: imgs, signal: D.ctl.signal } : { signal: D.ctl.signal });
      D.busy = false;
      if (!res || typeof res !== "object") throw { code: "invalid_json" };
      if (res.error && !res.title) { D.error = "Kein Rezept erkannt: " + res.error; renderAdd(); return; }
      const ingredients = [];
      let g = null;
      for (const i of Array.isArray(res.ingredients) ? res.ingredients : []) {
        if (!i || !i.name) continue;
        if (i.group && i.group !== g) { ingredients.push({ h: true, n: String(i.group).replace(/:$/, "") }); g = i.group; }
        ingredients.push({ a: num(i.amount), u: UNIT_MAP.get(String(i.unit || "").toLowerCase()) || String(i.unit || ""), n: String(i.name) });
      }
      let photo = null;
      const di = Number.isInteger(res.dishPhoto) ? res.dishPhoto : null;
      if (di != null && imgs[di]) { try { photo = await makePhoto(imgs[di]); } catch {} }
      closeSheet("add");
      openForm({
        title: String(res.title || ""), kind: res.kind === "süß" ? "süß" : "herzhaft",
        servings: num(res.servings) ? Math.round(num(res.servings)) : 4, time: num(res.time) ? Math.round(num(res.time)) : null,
        tags: cleanTags(Array.isArray(res.tags) ? res.tags : []), ingredients,
        steps: (Array.isArray(res.steps) ? res.steps : []).map(String).filter(Boolean), note: res.note ? String(res.note) : "", source: res.source ? String(res.source) : "",
      }, { photo, fromKI: true });
    } catch (e) {
      D.busy = false;
      if (e?.code === "cancelled") { renderAdd(); return; }
      D.error = KI_ERR[e?.code] || "Die Erkennung hat nicht geklappt. Versuch es noch einmal oder trage das Rezept von Hand ein.";
      renderAdd();
    }
  }
  function cleanTags(arr) {
    const out = [];
    for (let t of arr) {
      t = norm(String(t).replace(/^#/, "")).replace(/\s+/g, "-");
      if (t && t !== "süß" && t !== "herzhaft" && !out.includes(t)) out.push(t);
    }
    return out.slice(0, 10);
  }

  async function saveForm(ev) {
    ev.preventDefault();
    const F = S.form, err = $("#f-err");
    const title = $("#f-title").value.trim();
    if (!title) { err.textContent = "Gib dem Rezept einen Namen."; err.hidden = false; $("#f-title").focus(); return; }
    const ingredients = $("#f-ings").value.split("\n").map(parseIngLine).filter(Boolean);
    const steps = $("#f-steps").value.split("\n").map(s => s.replace(/^\s*(\d+[.)]|[-•*])\s*/, "").trim()).filter(Boolean);
    const old = F.id ? S.recipes.find(x => x.id === F.id) : null;
    const hasPhoto = !!F.thumb;
    const data = {
      title, kind: F.kind,
      servings: Math.max(1, Math.round(num($("#f-servings").value) || 4)),
      time: num($("#f-time").value) ? Math.round(num($("#f-time").value)) : null,
      tags: cleanTags($("#f-tags").value.split(/[,;\n]/)),
      ingredients, steps, note: $("#f-note").value.trim(), source: $("#f-source").value.trim(),
      thumb: F.thumb || null, hasPhoto,
      createdAt: old?.createdAt || Date.now(), updatedAt: Date.now(),
      lastCooked: old?.lastCooked || null, cookCount: old?.cookCount || 0,
    };
    $("#f-save").disabled = true; err.hidden = true;
    try {
      const ref = F.id ? S.db.doc("recipes/" + F.id) : S.db.collection("recipes").doc();
      if (F.photoChanged && F.photo) { await S.db.doc("photos/" + ref.id).set({ src: F.photo }); S.photos.set(ref.id, F.photo); }
      await ref.set(data);
      if (!hasPhoto && F.hadPhoto) { await S.db.doc("photos/" + ref.id).delete().catch(() => {}); S.photos.delete(ref.id); }
      closeSheet("form");
      toast(F.id ? "Gespeichert" : "Rezept hinzugefügt");
      if (!F.id) openDetail(ref.id);
    } catch (e) {
      $("#f-save").disabled = false;
      err.textContent = e?.code === "quota_exceeded" ? "Der Speicher ist voll. Lösche alte Rezepte oder Fotos." : e?.code === "invalid_argument" ? "Du darfst hier leider keine Rezepte speichern. Bitte den Besitzer der Seite, dich als Mitwirkenden einzuladen." : "Speichern hat nicht geklappt. Versuch es noch einmal.";
      err.hidden = false;
    }
  }

  /* ---------- Aktionen ---------- */

    const id = S.detail?.id;

    try {
      await S.db.doc("recipes/" + id).delete();
      await S.db.doc("photos/" + id).delete().catch(() => {});

  function resetFilters() { S.q = ""; $("#q").value = ""; $("#qclear").hidden = true; S.kind = "alle"; S.tags.clear(); S.ings = []; render(); }

  document.addEventListener("click", e => {
    const t = e.target.closest("button, [data-open]");
    if (!t) return;
    const d = t.dataset;
    if (d.open) return openDetail(d.open);
    if (d.close) return closeSheet(d.close);
    if (d.kind) { S.kind = d.kind; return render(); }
    if (d.tag) { S.tags.has(d.tag) ? S.tags.delete(d.tag) : S.tags.add(d.tag); return render(); }
    if (d.addIng !== undefined || t.hasAttribute("data-adding")) {
      const n = t.getAttribute("data-adding");
      if (!S.ings.includes(n)) S.ings.push(n);
      S.q = ""; $("#q").value = ""; $("#qclear").hidden = true; return render();
    }
    if (t.hasAttribute("data-rming")) { const n = t.getAttribute("data-rming"); S.ings = S.ings.filter(x => x !== n); return render(); }
    if (t.id === "resetall" || d.action === "reset") return resetFilters();
    if (d.serv && S.detail) {
      const r = S.recipes.find(x => x.id === S.detail.id);
      S.detail.servings = Math.min(50, Math.max(1, (S.detail.servings ?? (r?.servings || 4)) + +d.serv));
      return renderDetail();
    }
    if (d.mode) { stashDraft(); S.draft.mode = d.mode; S.draft.error = ""; return renderAdd(); }
    if (d.rmq) { S.db.doc("inbox/" + d.rmq).delete().catch(() => toast("Konnte nicht entfernt werden")); return; }
    if (d.rmimg) { const im = S.draft.images.splice(+d.rmimg, 1)[0]; if (im) URL.revokeObjectURL(im.url); return renderAdd(); }
    if (d.addtag) {
      const cur = cleanTags($("#f-tags").value.split(/[,;\n]/));
      cur.push(d.addtag); $("#f-tags").value = cur.join(", "); return renderFormBits();

    if (d.k && S.form) { S.form.kind = d.k; return renderFormBits(); }
    switch (d.action) {
      case "add": return openAdd();
      case "add-link": openAdd(); S.draft.mode = "link"; return renderAdd();
      case "manual": closeSheet("add"); return openForm({ kind: S.kind === "süß" ? "süß" : "herzhaft", servings: 4 });
      case "recognize": return recognize();
      case "queue": stashDraft(); return queueLink(S.draft.url, S.draft.text);

      case "cooked": return markCooked();
      case "edit": { const r = S.recipes.find(x => x.id === S.detail.id); if (r) openForm(r, { id: r.id }); return; }
      case "delete": S.detail.confirmDel = true; return renderDetail();

      case "delete-yes": return deleteRecipe();

  });

  // Hinzufügen: Dateien und Einfügen
  $("#add").addEventListener("change", e => { if (e.target.id === "addfiles") addFiles(e.target.files); });
  $("#add").addEventListener("dragover", e => { if (S.draft?.mode === "bild") { e.preventDefault(); $("#drop")?.classList.add("over"); } });
  $("#add").addEventListener("drop", e => { if (S.draft?.mode === "bild") { e.preventDefault(); addFiles(e.dataTransfer.files); } });
  $("#add").addEventListener("paste", e => {
    const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith("image/"));
    if (files.length && S.maxImages) { e.preventDefault(); S.draft.mode = "bild"; addFiles(files); }
  });

  // Formular
  $("#recipeform").addEventListener("submit", saveForm);
  $("#f-tags").addEventListener("input", () => renderFormBits());
  $("#f-title").addEventListener("input", () => { if (!S.form?.thumb) renderFormBits(); });
  $("#f-photofile").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    try { const p = await makePhoto(f); Object.assign(S.form, { photo: p.src, thumb: p.thumb, photoChanged: true }); renderFormBits(); }
    catch { toast("Dieses Bild konnte nicht gelesen werden"); }
  });
  $("#f-photodel").addEventListener("click", () => { Object.assign(S.form, { photo: null, thumb: null, photoChanged: false }); renderFormBits(); });

  /* ---------- Start ---------- */
  render();
  (async () => {
    const use = window.claude?.use;
    if (!use) { S.status = "nodb"; return render(); }
    const [db, user, sample] = await Promise.all([use("db"), use("user"), use("sample")]);
    if (!db) { S.status = "nodb"; return render(); }
    S.db = db;
    S.sample = sample;
    if (sample) { try { const l = await sample.limits(); S.maxImages = l?.images?.maxCount || 0; } catch { S.maxImages = 0; } }
    let can = null;
    try { can = user ? await user.can("data.write") : null; } catch {}
    S.canWrite = can !== false;
    db.collection("inbox").onSnapshot(snap => {
      S.inbox = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
      if (S.draft && !$("#add").hidden && S.draft.mode === "link" && !S.draft.busy) { stashDraft(); renderAdd(); }
    }, () => {});
    db.collection("recipes").onSnapshot(snap => {
      S.recipes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.status = "ready";
      render();
    }, () => { S.status = S.recipes.length ? "ready" : "error"; render(); });
  })();
})();
</script>
